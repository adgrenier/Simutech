[project]
name = "simutech"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pandas", "numpy", "pyarrow"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
